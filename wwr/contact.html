<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Contact Us - Rapid Fox River Rafting Contact Info</title>
    <meta name="description" content="Contact info for the Rapid Fox River Rafting Company.">
    <meta name="author" content="Alana Fox">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <div class="grid">
        <header>

            <img src="images/fox-river-rafting-logo.png" alt="Fox river logo" width="200">
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="trips.html">Trips</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>

            </nav>
        </header>
    </div>

    <main>

        <div class="contact-hero">

            <h1>Rapid Fox River Rafting</h1>
            <div class="address">
                <p>123 Main River Street </p>
                <p>Waves, Arizona </p>
                <p>+1 123 456 7891</p>
                <p>info@rapidfox.com</p>
            </div>

            <div class="form-columns">
                <form>
                    <div class="form-item-column-1">
                        <iframe
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d29092.46305221155!2d-88.30022921521777!3d42.167036131623625!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8805a9ab3936c009%3A0xd6dfd11bdf90b9b9!2sFox%20River!5e0!3m2!1sen!2sus!4v1763874845570!5m2!1sen!2sus"
                            width="300" height="400" allowfullscreen="" loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                    <div class="form-item-column-2">
                        <label for="fullname">Full Name:</label>
                        <input type="text" id="fullname" name="fullname" required>

                        <label for="useremail">Email:</label>
                        <input type="email" id="useremail" name="useremail" required>

                        <label>Message Purpose:</label>
                        <input type="radio" id="general-inquiry" name="purpose" value="general-inquiry">
                        <label for="general-inquiry">General Inquiry</label><br>
                        <input type="radio" id="reservation-question" name="purpose" value="reservation-question">
                        <label for="reservation-question">Reservation Question</label><br>
                        <input type="radio" id="website-suggestion" name="purpose" value="website-suggestion">
                        <label for="website-suggestion">Website Suggestion</label><br>


                        <label for="feedback">Message</label>
                        <textarea id="feedback" name="feedback" rows="4" placeholder="Type Here"></textarea>

                        <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
                        <input type="checkbox" id="subscribe" name="subscribe" value="yes" checked>

                        <button type="submit"> Get in Touch!</button>
                </form>

            </div>
        </div>


        <section class="section-two">
            <h2 class="title-two">We Are Here to Serve You</h2>

            <div class="two">
                <figure>
                    <img src="images/employee1.jpg" alt="employee one profile" width="250">
                    <figcaption>Big Water Boss</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="employee two profile" width="250">
                    <figcaption>Flow Rider</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="employee three profile" width="250">
                    <figcaption>Capsizing Cartwheeler</figcaption>
                </figure>

            </div>
        </section>
        </div>

    </main>


    <footer class="section-three">
        <p>&copy;2025 🦊 Rapid Fox River Rafting 🦊 Alana Fox</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="Linkedin Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
