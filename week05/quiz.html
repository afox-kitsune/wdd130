<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | Week 05 Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>


<body>
    <main>
        <h1>☑️ Basic HTML and CSS Quiz</h1>

        <form class="box">

            <div class="quiz-item box">
                <label for="q2">1.What is the acronym for the color stream in CSS?</label>
                <input type="text" id="q1" name="q1" required>
            </div>

            <div class="quiz-item box">
                <label for="q2">2.How can you add comments in CSS?</label>
                <textarea id="q2" name="q2" rows="4"></textarea>
            </div>

            <div class="quiz-item box">
                <label for="q3">3.What is not a way to include CSS?</label>
                <select name="q3" id="q3">
                    <option value="" selected disabled>Choose One...</option>
                    <option value="inline">Inline</option>
                    <option value="internal">Internal</option>
                    <option value="external">External</option>
                    <option value="outline">Outline</option>
                </select>
            </div>

            <div class="quiz-item box">
                <label for="q4">4.What is the bottom margin given this declaration?</label>
                <code>margin: 10px 5px 15px;</code>
                <input type="number" id="q4" name="q4">
            </div>
            <button type="submit"> Submit Quiz for Grading</button>
        </form>
    </main>
</body>

</footer>

</html>
